name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build (what `herdr plugin install` runs)
        run: cargo build --release --locked
      - name: Smoke test the binary
        shell: bash
        run: |
          ./target/release/herdr-fingers --version
          printf 'edit /etc/hosts\n' | ./target/release/herdr-fingers scan | grep -q '/etc/hosts'
          diff <(./target/release/herdr-fingers default-config) examples/config.toml

  deny:
    name: cargo-deny (bans · advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check bans advisories
